<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드충전수수료 지급내역</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--border:#2e3348;--border2:#3d4262;--text:#e8eaf6;--text2:#9ba3c7;--text3:#5c6490;--accent:#5c73f2;--accent2:#7b93ff;--accent-bg:rgba(92,115,242,.12);--green:#3ecf8e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:13px}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:15px;font-weight:700;color:var(--accent2)}
.logo em{color:var(--text2);font-style:normal;font-weight:400;font-size:12px;margin-left:8px}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2)}
.dbtn{padding:5px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s}
.dbtn:hover{background:rgba(239,68,68,.12);border-color:#ef4444;color:#ef4444}
.content{padding:20px 24px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.slabel{font-size:11px;color:var(--text3);margin-bottom:6px;letter-spacing:.3px}
.sval{font-size:20px;font-weight:700;line-height:1}
.sval.a{color:var(--accent2)}.sval.g{color:var(--green)}
.fbar{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{position:relative;flex:1;min-width:200px}
.sw svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3)}
input.si{width:100%;padding:8px 12px 8px 34px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
input.si:focus{border-color:var(--accent)}input.si::placeholder{color:var(--text3)}
select.fs{padding:8px 26px 8px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:12px;font-family:inherit;outline:none;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235c6490' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center;min-width:90px}
select.fs:focus{border-color:var(--accent)}select.fs option{background:var(--bg3)}
.tw{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tc{overflow-x:auto;max-height:calc(100vh - 370px);overflow-y:auto}
table{width:100%;border-collapse:collapse;min-width:900px;table-layout:fixed}
thead{position:sticky;top:0;z-index:10}
th:nth-child(1),td:nth-child(1){width:15%}
th:nth-child(2),td:nth-child(2){width:8%}
th:nth-child(3),td:nth-child(3){width:12%}
th:nth-child(4),td:nth-child(4){width:10%}
th:nth-child(5),td:nth-child(5){width:12%}
th:nth-child(6),td:nth-child(6){width:36%}
th:nth-child(7),td:nth-child(7){width:7%}
th{background:var(--bg3);color:var(--text2);font-weight:600;font-size:11px;letter-spacing:.4px;text-transform:uppercase;padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none;cursor:pointer}
th:hover{color:var(--text)}.si2{margin-left:4px;color:var(--text3);font-size:10px}
th.sorted{color:var(--accent2)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(92,115,242,.04)}
tr.total td{background:var(--bg3);border-top:2px solid var(--border2);font-weight:700;color:var(--accent2)}
tr.addrow td{text-align:center;padding:12px;color:var(--text3);cursor:pointer;font-weight:600;transition:all .15s}
tr.addrow:hover td{background:var(--accent-bg);color:var(--accent2)}
.am{text-align:right;font-family:'SF Mono','Fira Code',monospace;font-size:12px}
.am.p{color:var(--green)}.am.z{color:var(--text3)}
.mc{overflow:hidden}
input.mi{width:100%;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--text);font-size:12px;font-family:inherit;padding:3px 6px;outline:none}
input.mi:hover{border-color:var(--border2);background:var(--bg3)}input.mi:focus{border-color:var(--accent);background:var(--bg3)}input.mi::placeholder{color:var(--text3)}
input.mi.amt{text-align:right}
.pn{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.mh{text-align:right}
.nodata{padding:40px;text-align:center;color:var(--text3)}
.rc{padding:10px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">💳 카드충전수수료 <em>지급내역 조회 시스템</em></div>
  <button class="btn" onclick="exportExcel()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    엑셀 다운로드
  </button>
</div>
<div class="content">
  <div class="stats" id="stats"></div>
  <div class="fbar">
    <select class="fs" id="colf" onchange="applyF()">
      <option value="">전체 컬럼</option>
      <option value="협력사">협력사</option>
      <option value="은행">은행</option>
      <option value="계좌번호">계좌번호</option>
    </select>
    <select class="fs" id="amtf" onchange="applyF()">
      <option value="">금액 전체</option>
      <option value="has">금액 있음</option>
      <option value="none">금액 없음</option>
    </select>
    <div class="sw">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="si" id="search" placeholder="협력사명, 은행, 계좌번호 검색..." oninput="applyF()">
    </div>
  </div>
  <div class="fbar" style="padding:10px 14px">
    <span style="font-size:11px;color:var(--text3);white-space:nowrap">협력사 정렬:</span>
    <select class="fs" id="compSort" onchange="setCompSort(this.value)">
      <option value="recent">최근 등록순</option>
      <option value="name">이름순</option>
    </select>
  </div>
  <div class="fbar" style="padding:10px 14px">
    <span style="font-size:11px;color:var(--text3);white-space:nowrap">조회 기간:</span>
    <select class="fs" id="yearSel" onchange="selectY(this.value)"></select>
    <select class="fs" id="monthSel" onchange="selectM(this.value)"></select>
    <button class="dbtn" id="resetAmtBtn" style="margin-left:auto" onclick="resetAmounts()"></button>
    <span id="saveIndicator" style="font-size:11px;color:var(--text3);white-space:nowrap"></span>
  </div>
  <div class="tw">
    <div class="tc"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="rc"><span id="rct">로딩중...</span><span>* 마지막 행 = 합계</span></div>
  </div>
</div>

      saved.D.forEach(r=>D.push(r));
      Object.keys(mm).forEach(k=>delete mm[k]);
      D.forEach(d=>{mm[d.id]=(saved.mm&&saved.mm[d.id])||d.memo||'';});
    }
  }catch(e){}
}
loadSaved();

function fmt(n){if(!n)return '';return Math.round(n).toLocaleString('ko-KR');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rt(row){return M.reduce((s,m)=>s+(row[m]||0),0);}

function yearSelect(){
  const el=document.getElementById('yearSel');
  el.innerHTML=Y.map(y=>`<option value="${y}" ${selY===y?'selected':''}>${y}</option>`).join('');
}
function selectY(y){selY=y;render();}
function monthSelect(){
  const el=document.getElementById('monthSel');
  el.innerHTML=M.map(m=>`<option value="${m}" ${selM===m?'selected':''}>${m}</option>`).join('');
}
function selectM(m){selM=m;render();}

function thead(){
  const tr=document.getElementById('thead');
  const cols=[
    {k:'협력사',l:'협력사'},{k:'은행',l:'은행'},{k:'계좌번호',l:'계좌번호'},
    {k:'금액',l:`${selY} ${selM} 금액`,mo:true},
    {k:'과세기사콜비부가세',l:'과세기사콜비부가세',mo:true,ns:true},
    {k:'memo',l:'메모',ns:true},
    {k:'관리',l:'관리',ns:true}
  ];
  tr.innerHTML=cols.map(c=>{
    const s=sc===c.k?'sorted':'';
    const ic=sc===c.k?(sa?'▲':'▼'):'⇅';
    const al=c.mo||c.ca?'mh':'';
    const nc=c.ns?'style="cursor:default"':'';
    const oc=c.ns?'':`onclick="sortBy('${c.k}')"`;
    return `<th class="${s} ${al}" ${nc} ${oc}>${c.l}${!c.ns?`<span class="si2">${ic}</span>`:''}</th>`;
  }).join('');
}

function sortBy(col){if(sc===col) sa=!sa; else{sc=col;sa=true;} render();}

function setCompSort(v){
  if(v==='recent'){sc='id';sa=false;}
  else{sc='협력사';sa=true;}
  render();
}

function applyF(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const cf=document.getElementById('colf').value;
  const af=document.getElementById('amtf').value;
  fd=D.filter(row=>{
    if(q){
      let h='';
      if(!cf||cf==='협력사') h+=(row['협력사']||'').toLowerCase();
      if(!cf||cf==='은행') h+=(row['은행']||'').toLowerCase();
      if(!cf||cf==='계좌번호') h+=String(row['계좌번호']||'').toLowerCase();
      if(!h.includes(q)) return false;
    }
    if(af==='has'&&!M.some(m=>row[m]>0)) return false;
    if(af==='none'&&M.some(m=>row[m]>0)) return false;
    return true;
  });
  render();
}

function render(){
  thead(); yearSelect(); monthSelect();
  const s=[...fd].sort((a,b)=>{
    let av,bv;
    if(sc==='금액'){av=a[selM]||0;bv=b[selM]||0;}
    else if(sc==='id'){av=a.id;bv=b.id;}
    else{av=(a[sc]||'').toString();bv=(b[sc]||'').toString();}
    if(av<bv) return sa?-1:1; if(av>bv) return sa?1:-1; return 0;
  });

  const totSel=fd.reduce((s,r)=>s+(r[selM]||0),0);

  const tb=document.getElementById('tbody');
  const addRowHtml='<tr class="addrow" onclick="addRow()"><td colspan="7">+ 새 협력사 행 추가</td></tr>';
  if(!s.length){
    tb.innerHTML='<tr><td colspan="99" class="nodata">조회 결과가 없습니다</td></tr>'+addRowHtml;
  }else{
    tb.innerHTML=s.map(row=>{
      const av=row[selM];
      const tx=row['과세기사콜비부가세'];
      const me=esc(mm[row.id]||'');
      return `<tr>
        <td class="mc"><input class="mi pn" placeholder="협력사명 입력..." value="${esc(row['협력사']||'')}" oninput="saveCompany(${row.id},this.value)"></td>
        <td class="mc"><input class="mi" placeholder="은행 입력..." value="${esc(row['은행']||'')}" oninput="saveBank(${row.id},this.value)"></td>
        <td class="mc"><input class="mi" placeholder="계좌번호 입력..." value="${esc(String(row['계좌번호']||''))}" oninput="saveAccount(${row.id},this.value)"></td>
        <td class="mc"><input class="mi amt" placeholder="금액 입력..." value="${fmt(av)}" onchange="saveAmt(${row.id},this.value)"></td>
        <td class="mc"><input class="mi amt" placeholder="금액 입력..." value="${fmt(tx)}" onchange="saveTax(${row.id},this.value)"></td>
        <td class="mc"><input class="mi" placeholder="메모..." value="${me}" oninput="saveMemo(${row.id},this.value)"></td>
        <td style="text-align:center"><button class="dbtn" onclick="deleteRow(${row.id})">삭제</button></td>
      </tr>`;
    }).join('');
    tb.innerHTML+=addRowHtml;
    tb.innerHTML+=`<tr class="total"><td>✦ 합계</td><td></td><td></td><td class="am">${fmt(totSel)}</td><td></td><td></td><td></td></tr>`;
  }

  document.getElementById('resetAmtBtn').textContent=`${selM} 금액 전체 초기화`;
  document.getElementById('stats').innerHTML=`
    <div class="scard"><div class="slabel">협력사 수</div><div class="sval a">${fd.length}개</div></div>
    <div class="scard"><div class="slabel">${selY} ${selM} 총 지급금액 (원)</div><div class="sval g">${fmt(totSel)}</div></div>
  `;
  document.getElementById('rct').textContent=`총 ${fd.length}개 협력사 표시 (전체 ${D.length}개)`;
}

let _saveTimer=null;
function autoSave(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({D,mm}));}catch(e){return;}
  const el=document.getElementById('saveIndicator');
  if(!el) return;
  el.textContent='✓ 자동 저장됨';
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{el.textContent='';},1500);
}

function saveMemo(id,v){mm[id]=v;autoSave();}
function saveBank(id,v){const row=D.find(r=>r.id===id);if(row){row['은행']=v;autoSave();}}
function saveAccount(id,v){const row=D.find(r=>r.id===id);if(row){row['계좌번호']=v;autoSave();}}
function saveCompany(id,v){const row=D.find(r=>r.id===id);if(row){row['협력사']=v;autoSave();}}
function saveAmt(id,v){
  const row=D.find(r=>r.id===id);
  if(!row) return;
  const num=Number(String(v).replace(/[^0-9.-]/g,''));
  if(num) row[selM]=num; else delete row[selM];
  autoSave();render();
}
function saveTax(id,v){
  const row=D.find(r=>r.id===id);
  if(!row) return;
  const num=Number(String(v).replace(/[^0-9.-]/g,''));
  if(num) row['과세기사콜비부가세']=num; else delete row['과세기사콜비부가세'];
  autoSave();render();
}

function addRow(){
  const id=D.length?Math.max(...D.map(r=>r.id))+1:0;
  D.push({'협력사':'새 협력사','은행':'','계좌번호':'','id':id,'memo':''});
  mm[id]='';
  sc='id';sa=true;
  autoSave();applyF();
}

function deleteRow(id){
  if(!confirm('이 행을 삭제하시겠습니까?')) return;
  const idx=D.findIndex(r=>r.id===id);
  if(idx>-1) D.splice(idx,1);
  delete mm[id];
  autoSave();applyF();
}

function resetAmounts(){
  if(!confirm(`${selM} 금액을 전체 초기화하시겠습니까?`)) return;
  D.forEach(r=>{delete r[selM];});
  autoSave();applyF();
}

function exportExcel(){
  const wb=XLSX.utils.book_new();
  const h=['협력사','은행','계좌번호',...M,'합계','과세기사콜비부가세','메모'];
  const rows=D.map(r=>[r['협력사']||'',r['은행']||'',String(r['계좌번호']||''),...M.map(m=>r[m]||''),rt(r),r['과세기사콜비부가세']||'',mm[r.id]||'']);
  const tots=M.map(m=>D.reduce((s,r)=>s+(r[m]||0),0));
  const g=D.reduce((s,r)=>s+rt(r),0);
  rows.push(['합계','','',...tots,g,'','']);
  const ws=XLSX.utils.aoa_to_sheet([h,...rows]);
  ws['!cols']=[{wch:25},{wch:14},{wch:20},...M.map(()=>({wch:14})),{wch:16},{wch:16},{wch:30}];
  XLSX.utils.book_append_sheet(wb,ws,'카드충전수수료');
  const mr=D.filter(r=>mm[r.id]).map(r=>[r['협력사'],mm[r.id]]);
  if(mr.length){
    const mws=XLSX.utils.aoa_to_sheet([['협력사','메모'],...mr]);
    XLSX.utils.book_append_sheet(wb,mws,'메모');
  }
  const d=new Date();
  XLSX.writeFile(wb,`카드충전수수료_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.xlsx`);
}

yearSelect(); monthSelect(); applyF();
</script>
</body>
</html>
